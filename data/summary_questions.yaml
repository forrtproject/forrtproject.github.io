# Questions to start a summary collection from (layouts/partials/doors/summary_questions.html). Each page load shows
# a few, picked at random from different topics: three on a wide screen, one on a phone. Without JavaScript the
# first three (one on a phone) show, so keep a good mix at the top.
#
# Each item:
#   question  FORRT's prompt, in plain words and short (it should fit three lines of a card), no wider than the
#             answer supports: name the study's sample, place or period where the answer is about one study.
#   summary   the summary's anchor, its Id in data/summaries.json (the #h.… in a link to it).
#   takeaway  which takeaway answers the question (1 for the first, the default); the card shows its first sentence.
#   answer    instead of a takeaway's first sentence, words quoted exactly from one of the summary's takeaways; a
#             quote may start mid-sentence (the card capitalises its first letter). The build warns when they are not
#             found there.
#   topic     a broad topic; the questions shown together come from different topics where possible.
# Keyed by the collection page's file name.

open-reproducible:
  - question: "How many researchers in Nature's survey had failed to reproduce an experiment?"
    summary: h.b6z4jk7jx6u4    # Is there a Reproducibility Crisis? (Baker, 2016)
    topic: replication
  - question: "What happens when researchers try many ways to analyse their data?"
    summary: h.sxh34fk82cfh    # False-Positive Psychology (Simmons et al., 2011)
    takeaway: 2
    topic: statistics
  - question: "What does Fogarty argue about crediting students and technicians?"
    summary: h.pe8rcgd61rc2    # Don't erase undergrad researchers and technicians from author lists (Fogarty, 2020)
    takeaway: 6
    topic: careers
  - question: "In one experiment, how did reviewers judge results against their own views?"
    summary: h.e0omhrfflv5j    # Publication Prejudices (Mahoney, 1977)
    answer: "Reviewers were more likely to show confirmation bias for manuscripts in favour of their theoretical perspective and were more severe for manuscripts that contradict their perspective."
    topic: publishing
  - question: "In one archive of experiments, how many null results were published?"
    summary: h.rkwbar4u93b1    # Publication bias in the social sciences (Franco et al., 2014)
    answer: "Although around half of the total studies in our sample were published, only 20% of those with null results were published."
    topic: publishing
  - question: "Why can a significant result look large in a study with low power?"
    summary: h.igvfoqwodfne    # Confidence and precision increase with high statistical power (Button et al., 2013)
    answer: "in studies with low statistical power, an observed effect will necessarily be large if it is to pass p < .05, but this does not mean that the true effect will be large, or even exist at all."
    topic: statistics
  - question: "Do 70 teams given the same brain-imaging data reach the same conclusions?"
    summary: h.tg0pwz8me713    # Variability in the analysis of a single neuroimaging dataset (Botvinik-Nezer et al., 2020)
    answer: "The analytical flexibility resulted in sizable variation in the results of hypothesis tests"
    topic: replication
  - question: "By one estimate, how many hours went into peer review in 2019?"
    summary: h.nig7z4s2d4ek    # How much Free Labor? (Aczel & Szaszi, 2020)
    answer: "The total time reviewers worked on peer-review in 2019 is over 100 million hours"
    topic: publishing
  - question: "Which people does much research on human behaviour rely on?"
    summary: h.pxy9j3hosvxg    # Most people are not WEIRD (Henrich et al., 2010)
    topic: participants
  - question: "In one study, what went with authors' reluctance to share their data?"
    summary: h.1mu3kuufj5he    # Willingness to Share Research Data (Wicherts et al., 2011)
    answer: "Reluctance to share was linked with weaker evidence and higher prevalence of apparent errors to report results."
    topic: integrity
  - question: "Could participants recall a code word from the consent form they signed?"
    summary: h.czpcisyxcdpb    # Participant Attentiveness to Consent Forms (Baker & Chartier, 2018)
    answer: "The vast majority of participants did not respond to the prompt asking for a code word; some provided an incorrect guess using words such as pizza, baseball, and password."
    topic: participants
  - question: "In a 2017 survey, how many PhD students listed mental health as a concern?"
    summary: h.v7kmozf9h8f7    # The mental health of PhD researchers demands urgent attention (Nature, 2019)
    answer: "29% of 5700 respondents to a survey in 2017 listed their mental health as an area of concern"
    topic: careers
  - question: "By 2012, what had changed in how fast editors retract articles?"
    summary: h.2eytwz4yehi     # Why Has the Number of Scientific Retractions Increased? (Steen et al., 2013)
    answer: "Editors are retracting articles significantly faster now than in the past."
    topic: integrity
  - question: "How was a p-value just above .05 reported in 2005 compared with 1965?"
    summary: h.b910lefd5hzk    # The life of p (Leggett et al., 2013)
    answer: "p values close to but over .05 were more likely to be rounded down (e.g. p = .053 becomes p < .05) or incorrectly reported as significant in 2005 than in 1965."
    topic: statistics
  - question: "What changes when peer review happens before the results are in?"
    summary: h.4q6lmxfiq5cj    # Registered Reports: Realigning incentives in scientific publishing (Chambers et al., 2015)
    topic: publishing

diversity-equity-inclusion:
  - question: "In the US in 2013, how many low-income school leavers went to university?"
    summary: h.8o4sw2yfyebr    # Is science only for the rich? (Lee, 2016)
    answer: "only about 40% of high-school graduates in the lowest-income bracket enrolled in a university in 2013, versus about 68% of those born to families with the highest incomes."
    topic: class
  - question: "How did faculty rate the same application under a man's or a woman's name?"
    summary: h.b7x4grs848ff    # Science faculty's subtle gender biases favour male students (Moss-Racusin et al., 2012)
    answer: "Faculty participants rated the male applicant as significantly more competent and hireable than the (identical) female applicant."
    topic: gender
  - question: "How can publishing fees keep some scientists out of open science?"
    summary: h.b6say8wj1wto    # Open Science Isn't Always Open to All Scientists (Bahlai et al., 2019)
    answer: "Open Access processing fees may prevent scientists from sharing their work, as not all institutions/individuals have the resources to overcome these barriers."
    topic: access
  - question: "In papers from 2008 to 2012, how often were women first authors?"
    summary: h.36lhjcfi5x2s    # Global gender disparities in science (Lariviere et al., 2013)
    takeaway: 10
    topic: gender
  - question: "At grand rounds, did men introduce women by their title as often as men?"
    summary: h.ev2qjehq96en    # Speaker Introductions at Internal Medicine Grand Rounds (Files et al., 2017)
    takeaway: 5
    topic: gender
  - question: "On US graduate syllabi in social psychology, how many papers had a female first author?"
    summary: h.j2lw9gk12js0    # The Gender Gap on Graduate-Level Syllabi (Skitka et al., 2020)
    answer: "Less than 30% of papers referenced on syllabi were written by female first authors."
    topic: gender
  - question: "How did research on gender bias fare against research on racial bias?"
    summary: h.t7jyy2cy17mq    # Bias against research on gender bias (Cislak et al., 2018)
    answer: "Articles on gender bias are funded less often and published in journals with lower Impact factor than articles on similar instances of social discrimination."
    topic: gender
  - question: "How did wanting to help others relate to students' interest in STEM?"
    summary: h.q9x4ao71m2h6    # Seeking Congruity Between Goals and Roles (Diekman et al., 2010)
    answer: "When individuals highly endorse communal goals, they are less interested in STEM."
    topic: careers
  - question: "Who do Whitaker and Guest say should do the most for inclusion?"
    summary: h.v609k29k4ux6    # #bropenscience is broken science (Whitaker & Guest, 2020)
    takeaway: 11
    topic: inclusion
  - question: "How can events be easier to follow for colleagues who are hard of hearing?"
    summary: h.v609k29k4ux6    # #bropenscience is broken science (Whitaker & Guest, 2020)
    answer: "using a microphone at in person events or providing live transcription and sign language translation for online events so that hard of hearing and autistic colleagues (among others) can engage more effectively."
    topic: access
