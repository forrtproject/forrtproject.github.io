{{- define "main" -}}

{{ partial "doors/reading" . }}
<div class="wrap">
  <ul class="plain-list">
    {{ if gt (len .Sections) 0}}
    {{ range .Sections }}
    <li><a href="{{.RelPermalink}}">{{.LinkTitle}}</a> {{with .Params.summary}}<p>{{. | plainify | emojify}}</p>{{end}}</li>
    {{end}}
    {{end}}
  </ul>
</div>

{{- end -}}
