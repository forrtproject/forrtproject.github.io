{{- define "main" -}}
<div class="wrap analysis-page">
  <div class="article-layout article-layout-wide">
    <article class="reading">
      <header class="article-head">
        {{ partial "doors/crumbs" (dict "page" .) }}
        <h1>{{ .Title }}</h1>
      </header>
      <div class="article-style">{{ partial "doors/content" .Content }}</div>
    </article>
  </div>
<div class="analysis-network">
  <iframe id="network-graph" title="Network of FORRT contributors" src="/partials/network-graph.html" width="100%" style="border: none; overflow: hidden;" scrolling="no"></iframe>
</div>

<script>
  (function() {
    var iframe = document.getElementById('network-graph');
    if (!iframe) {
      return;
    }

    function resizeIframe() {
      if (!iframe.contentWindow) {
        return;
      }
      var doc = iframe.contentDocument || iframe.contentWindow.document;
      if (!doc || !doc.documentElement) {
        return;
      }
      var newHeight = doc.documentElement.scrollHeight;
      if (!newHeight) {
        return;
      }
      var targetHeight = newHeight + 'px';
      if (iframe.style.height !== targetHeight) {
        iframe.style.height = targetHeight;
      }
    }

    iframe.addEventListener('load', function() {
      resizeIframe();

      if (!iframe._autoResizeInterval) {
        iframe._autoResizeInterval = setInterval(function() {
          if (!document.body.contains(iframe)) {
            clearInterval(iframe._autoResizeInterval);
            iframe._autoResizeInterval = null;
            return;
          }
          resizeIframe();
        }, 500);
      }
    });

    window.addEventListener('resize', resizeIframe);
  })();
</script>

</div>

{{- end -}}
