{{/* Hidden until the script below runs: without it the buttons would do nothing. */}}
<div class="filter-container partner-filters" hidden>

    {{/* Cluster Filter */}}
    <label class="filter-section-title" for="partner-select">Filter by partner category</label>
    {{/* On a phone the categories are a drop-down; on wider screens, buttons. */}}
    <select id="partner-select" class="partner-select">
        <option value="all">All partners</option>
        <option value="Global Intergovernmental Organizations">Global intergovernmental organizations</option>
        <option value="Open Science Infrastructure">Open science infrastructure</option>
        <option value="Reproducibility Networks">Reproducibility networks</option>
        <option value="Open Research Communities">Open research communities</option>
        <option value="Education & Training">Education and training</option>
        <option value="Open Research & Equity">Open research and equity</option>
        <option value="Higher Education Partners">Higher education partners</option>
    </select>
    <div id="pill-bar-cluster" class="pill-bar" role="group" aria-label="Partner category">
        <button type="button" class="filter-pill active" aria-pressed="true" data-group="cluster" data-value="all">All partners</button>
        <button type="button" class="filter-pill" aria-pressed="false" data-group="cluster" data-value="Global Intergovernmental Organizations">Global intergovernmental organizations</button>
        <button type="button" class="filter-pill" aria-pressed="false" data-group="cluster" data-value="Open Science Infrastructure">Open science infrastructure</button>
        <button type="button" class="filter-pill" aria-pressed="false" data-group="cluster" data-value="Reproducibility Networks">Reproducibility networks</button>
        <button type="button" class="filter-pill" aria-pressed="false" data-group="cluster" data-value="Open Research Communities">Open research communities</button>
        <button type="button" class="filter-pill" aria-pressed="false" data-group="cluster" data-value="Education & Training">Education and training</button>
        <button type="button" class="filter-pill" aria-pressed="false" data-group="cluster" data-value="Open Research & Equity">Open research and equity</button>
        <button type="button" class="filter-pill" aria-pressed="false" data-group="cluster" data-value="Higher Education Partners">Higher education partners</button>
    </div>

    {{/* Empty State Warning */}}
    <div id="no-partners-warning" style="display: none; text-align: center; margin-top: 2rem; color: #666;">
        <h4><i class="fas fa-search"></i> No partners found</h4>
        <p>There are no partners matching the selected category.</p>
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelector('.partner-filters').hidden = false;
        const clusterPills = document.querySelectorAll('#pill-bar-cluster .filter-pill');
        const partnerCards = document.querySelectorAll('.partner-card');
        const sections = document.querySelectorAll('.partner-section-group');
        const warningDiv = document.getElementById('no-partners-warning');

        let currentCluster = 'all';

        function filterPartners() {
            let visibleCount = 0;

            partnerCards.forEach(card => {
                const cardCluster = card.getAttribute('data-cluster');

                let shouldShow = false;

                if (currentCluster === 'all') {
                    shouldShow = true;
                } else {
                    shouldShow = (cardCluster === currentCluster);
                }

                if (shouldShow) {
                    card.style.display = "";
                    visibleCount++;
                } else {
                    card.style.display = "none";
                }
            });

            // Hide empty sections
            sections.forEach(section => {
                const visibleCards = section.querySelectorAll('.partner-card:not([style*="display: none"])');
                if (visibleCards.length === 0) {
                    section.style.display = "none";
                } else {
                    section.style.display = "";
                }
            });

            // Show warning if no partners found
            if (visibleCount === 0) {
                warningDiv.style.display = "block";
            } else {
                warningDiv.style.display = "none";
            }
        }

        // Buttons and drop-down choose the same category and stay in step.
        const select = document.getElementById('partner-select');
        function choose(value) {
            clusterPills.forEach(p => {
                const on = p.getAttribute('data-value') === value;
                p.classList.toggle('active', on);
                p.setAttribute('aria-pressed', String(on));
            });
            select.value = value;
            currentCluster = value;
            filterPartners();
        }
        clusterPills.forEach(pill => pill.addEventListener('click', () => choose(pill.getAttribute('data-value'))));
        select.addEventListener('change', () => choose(select.value));
    });
</script>
