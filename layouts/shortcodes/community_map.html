<!--community_map.html-->
{{/* Usage: {{< community_map [height] >}}. Embeds the static Leaflet map at static/apps/community_map.html, regenerated from https://github.com/forrtproject/map-community; height is in px (default 600). */}}
<iframe src="{{ "apps/community_map.html" | relURL }}"
        title="FORRT Community Map" loading="lazy"
        style="height:{{ .Get 0 | default "600" }}px;width:100%;border:none;"></iframe>
