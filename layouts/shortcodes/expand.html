{{ $_hugo_config := `{ "version": 1 }` }}
{{ $expandMessage := T "Expand-title" }}
<details class="spoiler expand">
  <summary>{{ if .IsNamedParams }}{{ .Get "default" | default $expandMessage }}{{ else }}{{ .Get 0 | default $expandMessage }}{{ end }}</summary>
  <div class="spoiler-body">{{ .Inner | markdownify | emojify | safeHTML }}</div>
</details>
