{{- $meta := partialCached "citations/metadata" .apa .apa -}}
<li id="ref-{{ .key }}" data-reference="{{ .key }}" data-first-author="{{ $meta.first }}" data-authors="{{ $meta.names | jsonify }}" data-etal="{{ $meta.etal }}" data-year="{{ $meta.year }}"{{ with $meta.url }} data-source="{{ . }}"{{ end }}>{{ .apa | markdownify }}</li>
