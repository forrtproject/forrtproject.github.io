name: Doors preview

# =======================
# Doors Redesign Preview
# =======================
# Purpose: Builds the rebrand-doors branch and publishes it at forrt.org/rebrand-doors/
# Triggers: Push to rebrand-doors, and PRs into it (checks only, no deployment)
# Target: forrtproject/rebrand-doors, on GitHub Pages under the forrt.org domain
# Checks: Every run also builds the merge base with main from the same data, then compares
#         the two builds.
#         A failed check shows on the run but does not hold back the preview.
# Layout: The branch and PR base build in parallel. The main comparison uses the branch inputs.
#         The browser checks use the changed pages or a core sample for CSS/JS-only changes.
#         Pushes, the full-checks label, check infrastructure changes and large diffs use the full suite.
#         "Compare with main" still checks the whole site. "Check results" aggregates failures.
# Note: Uses the same data and announcement artifacts as deploy.yaml. Delete this
#       workflow when the redesign launches.

on:
  push:
    branches:
      - rebrand-doors
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - rebrand-doors

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"  # Output is flushed as it is printed, so the log's timestamps show which section is slow.
  HUGO_VERSION: "0.158.0"
  HUGO_EXTENDED: true
  PLAYWRIGHT_VERSION: "1.63.0"
  PREVIEW_BASE: /rebrand-doors/
  PREVIEW_URL: https://forrt.org/rebrand-doors/

concurrency:
  group: rebrand-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    # Fork PRs get no artifacts token and have no preview to update.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      actions: read  # Needed for artifact access
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Let Git report non-ASCII paths unquoted
        run: git config core.quotepath false

      # Both builds use main artifacts. A new upload between downloads can add
      # generated-page diffs, which are included in selection or trigger full checks.
      - name: Download data artifact
        uses: dawidd6/action-download-artifact@07ab29fd4a977ae4d2b275087cf67563dfdf0295
        continue-on-error: true
        with:
          workflow: data-processing.yml
          name: data-artifact
          path: ${{ runner.temp }}/artifacts/data
          github_token: ${{ secrets.GITHUB_TOKEN }}
          search_artifacts: true
          branch: main  # as in deploy.yaml: only main's runs, never a branch test run (#960)
          if_no_artifact_found: warn

      - name: Download announcements artifact
        uses: dawidd6/action-download-artifact@07ab29fd4a977ae4d2b275087cf67563dfdf0295
        continue-on-error: true
        with:
          workflow: create_announcements.yml
          name: announcements-artifact
          path: ${{ runner.temp }}/artifacts/announcements
          github_token: ${{ secrets.GITHUB_TOKEN }}
          search_artifacts: true
          branch: main  # as in deploy.yaml: only main's runs, never a branch test run (#960)
          if_no_artifact_found: warn

      - name: Apply artifacts
        run: |
          scripts/rebrand/apply_artifacts.sh . \
            "$RUNNER_TEMP/artifacts/data" "$RUNNER_TEMP/artifacts/announcements"

      - name: Rebuild the Contributors page with this branch's generator
        env:
          PYTHONHASHSEED: "0"  # The generator picks role labels from a set.
        run: |
          pip install --quiet numpy==1.24.4 pandas==2.0.3 python-dotenv  # pinned as in requirements.txt
          if python3 scripts/forrt_contribs/tenzing.py; then
            mv scripts/forrt_contribs/tenzing.md content/contributors/tenzing.md
          else
            echo "::warning::Could not regenerate the Contributors page; the preview shows the data artifact's copy."
          fi

      # "Compare with main" builds the reference from these same files, not from whatever
      # data run is newest by the time it starts.
      - name: Pack the artifacts for the reference build
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts/data" "$RUNNER_TEMP/artifacts/announcements"
          tar -cf inputs.tar -C "$RUNNER_TEMP" artifacts

      - name: Upload the artifacts for the reference build
        uses: actions/upload-artifact@v7
        with:
          name: rebrand-inputs-${{ github.run_number }}
          path: inputs.tar
          retention-days: 1
          overwrite: true
          if-no-files-found: error

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: ${{ env.HUGO_EXTENDED }}

      # Keep reusable entries for later builds. Each job restores its own cache snapshot.
      - name: Cache Hugo resources
        uses: actions/cache@v5
        with:
          path: |
            ./resources/_gen
            ${{ runner.temp }}/hugo-cache
          key: hugo-${{ runner.os }}-${{ runner.arch }}-${{ env.HUGO_VERSION }}-head-${{ github.sha }}
          restore-keys: |
            hugo-${{ runner.os }}-${{ runner.arch }}-${{ env.HUGO_VERSION }}-head-

      # HUGO_ENV=staging adds noindex and leaves out Google Analytics.
      - name: Build the branch
        run: hugo --cacheDir "$RUNNER_TEMP/hugo-cache" --minify --cleanDestinationDir --destination public --baseURL "$PREVIEW_URL"
        env:
          HUGO_ENV: staging

      - name: Point root-relative links at the subfolder
        run: python3 scripts/rebrand/preview_paths.py public --base "$PREVIEW_BASE"

      # One file uploads and downloads far faster than the site's thousands.
      - name: Pack the site
        run: tar -cf site.tar -C public .

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: rebrand-preview-${{ github.run_number }}
          path: site.tar
          retention-days: 1
          compression-level: 1
          overwrite: true  # A rerun reuses the run number.
          if-no-files-found: error

  reference:
    name: Build PR base
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'full-checks')
    permissions:
      contents: read
      actions: read
    outputs:
      scoped: ${{ steps.scope.outputs.scoped }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Let Git report non-ASCII paths unquoted
        run: git config core.quotepath false

      - name: Select full or scoped checks
        id: scope
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --filter=blob:none origin "$HEAD_SHA"
          if ! git diff --quiet HEAD "$HEAD_SHA" -- .github/workflows/rebrand-preview.yaml \
              ':(glob)scripts/rebrand/check_*.py' scripts/rebrand/changed_pages.py scripts/rebrand/sample_pages.json; then
            echo "scoped=false" >> "$GITHUB_OUTPUT"
          else
            echo "scoped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download data artifact
        if: steps.scope.outputs.scoped == 'true'
        uses: dawidd6/action-download-artifact@07ab29fd4a977ae4d2b275087cf67563dfdf0295
        continue-on-error: true
        with:
          workflow: data-processing.yml
          name: data-artifact
          path: ${{ runner.temp }}/artifacts/data
          github_token: ${{ secrets.GITHUB_TOKEN }}
          search_artifacts: true
          branch: main  # as in deploy.yaml: only main's runs, never a branch test run (#960)
          if_no_artifact_found: warn

      - name: Download announcements artifact
        if: steps.scope.outputs.scoped == 'true'
        uses: dawidd6/action-download-artifact@07ab29fd4a977ae4d2b275087cf67563dfdf0295
        continue-on-error: true
        with:
          workflow: create_announcements.yml
          name: announcements-artifact
          path: ${{ runner.temp }}/artifacts/announcements
          github_token: ${{ secrets.GITHUB_TOKEN }}
          search_artifacts: true
          branch: main  # as in deploy.yaml: only main's runs, never a branch test run (#960)
          if_no_artifact_found: warn

      - name: Apply artifacts
        if: steps.scope.outputs.scoped == 'true'
        run: |
          scripts/rebrand/apply_artifacts.sh . \
            "$RUNNER_TEMP/artifacts/data" "$RUNNER_TEMP/artifacts/announcements"

      - name: Rebuild the Contributors page with the PR base's generator
        if: steps.scope.outputs.scoped == 'true'
        env:
          PYTHONHASHSEED: "0"
        run: |
          pip install --quiet numpy==1.24.4 pandas==2.0.3 python-dotenv  # pinned as in requirements.txt
          if python3 scripts/forrt_contribs/tenzing.py; then
            mv scripts/forrt_contribs/tenzing.md content/contributors/tenzing.md
          else
            echo "::warning::Could not regenerate the Contributors page; the preview shows the data artifact's copy."
          fi

      - name: Setup Hugo
        if: steps.scope.outputs.scoped == 'true'
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: ${{ env.HUGO_EXTENDED }}

      - name: Cache Hugo resources
        if: steps.scope.outputs.scoped == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ./resources/_gen
            ${{ runner.temp }}/hugo-cache
          key: hugo-${{ runner.os }}-${{ runner.arch }}-${{ env.HUGO_VERSION }}-base-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            hugo-${{ runner.os }}-${{ runner.arch }}-${{ env.HUGO_VERSION }}-base-
            hugo-${{ runner.os }}-${{ runner.arch }}-${{ env.HUGO_VERSION }}-head-${{ github.event.pull_request.base.sha }}
            hugo-${{ runner.os }}-${{ runner.arch }}-${{ env.HUGO_VERSION }}-head-

      # HUGO_ENV=staging adds noindex and leaves out Google Analytics.
      - name: Build the PR base
        if: steps.scope.outputs.scoped == 'true'
        run: hugo --cacheDir "$RUNNER_TEMP/hugo-cache" --minify --destination public --baseURL "$PREVIEW_URL"
        env:
          HUGO_ENV: staging

      - name: Point root-relative links at the subfolder
        if: steps.scope.outputs.scoped == 'true'
        run: python3 scripts/rebrand/preview_paths.py public --base "$PREVIEW_BASE"

      - name: Pack pages and bundles
        if: steps.scope.outputs.scoped == 'true'
        working-directory: public
        run: find . -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -print0 | tar --null -T - -cf ../site.tar

      - name: Upload site artifact
        if: steps.scope.outputs.scoped == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rebrand-pr-base-${{ github.run_number }}
          path: site.tar
          retention-days: 1
          compression-level: 1
          overwrite: true  # A rerun reuses the run number.
          if-no-files-found: error

  compare:
    name: Compare with main
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      contents: read
      actions: read  # Needed for artifact access
    outputs:
      source-rules: ${{ steps.source-rules.outcome }}
      compare: ${{ steps.compare.outcome }}
      links: ${{ steps.links.outcome }}
      seo: ${{ steps.seo.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Let Git report non-ASCII paths unquoted
        run: git config core.quotepath false

      # The point where the branch last took main, not main's tip: otherwise anything landing
      # on main shows up here as a change, until main is next merged in.
      - name: Check out the merge base with main as the reference
        run: git worktree add --detach "$RUNNER_TEMP/reference" "$(git merge-base origin/main HEAD)"

      - name: Download the artifacts the branch was built with
        uses: actions/download-artifact@v7
        with:
          name: rebrand-inputs-${{ github.run_number }}
          path: ${{ runner.temp }}

      - name: Apply the same artifacts to the reference
        run: |
          tar -xf "$RUNNER_TEMP/inputs.tar" -C "$RUNNER_TEMP"
          scripts/rebrand/apply_artifacts.sh "$RUNNER_TEMP/reference" \
            "$RUNNER_TEMP/artifacts/data" "$RUNNER_TEMP/artifacts/announcements"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: ${{ env.HUGO_EXTENDED }}

      - name: Cache Hugo resources
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/reference/resources/_gen
            ${{ runner.temp }}/hugo-cache
          key: hugo-${{ runner.os }}-${{ runner.arch }}-${{ env.HUGO_VERSION }}-main-${{ github.sha }}
          restore-keys: |
            hugo-${{ runner.os }}-${{ runner.arch }}-${{ env.HUGO_VERSION }}-main-

      - name: Build the reference from the same data
        working-directory: ${{ runner.temp }}/reference
        run: |
          hugo --cacheDir "$RUNNER_TEMP/hugo-cache" --minify --destination "$RUNNER_TEMP/public-reference" --baseURL "$PREVIEW_URL"
          python3 "$GITHUB_WORKSPACE/scripts/rebrand/preview_paths.py" "$RUNNER_TEMP/public-reference" --base "$PREVIEW_BASE"
        env:
          HUGO_ENV: staging

      - name: Download the branch's build
        uses: actions/download-artifact@v7
        with:
          name: rebrand-preview-${{ github.run_number }}

      - name: Unpack the site
        run: mkdir public && tar -xf site.tar -C public

      - name: Templates and generated paths
        id: source-rules
        continue-on-error: true
        run: python3 scripts/rebrand/check_source_rules.py --base origin/main

      - name: URL list, structured data and SEO tags against the reference
        id: compare
        continue-on-error: true
        run: python3 scripts/rebrand/compare_builds.py "$RUNNER_TEMP/public-reference" public

      - name: Internal links
        id: links
        continue-on-error: true
        run: |
          python3 scripts/rebrand/check_internal_links.py public --base "$PREVIEW_BASE" \
            --reference "$RUNNER_TEMP/public-reference"

      - name: Built HTML (headings, conditional assets, image alt and dimensions)
        id: seo
        continue-on-error: true
        run: python3 scripts/check_seo_html.py public

  design:
    name: Designed screens
    runs-on: ubuntu-22.04
    needs: [build, reference]
    # The reference build is intentionally skipped in full mode.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.reference.result == 'success' || needs.reference.result == 'skipped') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download the branch's build
        uses: actions/download-artifact@v7
        with:
          name: rebrand-preview-${{ github.run_number }}

      - uses: actions/download-artifact@v7
        if: needs.reference.outputs.scoped == 'true'
        with:
          name: rebrand-pr-base-${{ github.run_number }}
          path: base
      - name: Compare pages and bundles
        id: selection
        env:
          SCOPED: ${{ needs.reference.outputs.scoped }}
        run: |
          if [ "$SCOPED" = true ]; then
            tar -xf base/site.tar -C base
            mkdir public
            tar -xf site.tar -C public
            python3 scripts/rebrand/changed_pages.py base public --out changed.json | tee selection.log
          else
            python3 scripts/rebrand/changed_pages.py --full --out changed.json | tee selection.log
          fi
          sed -n 's/^Check mode: /mode=/p' selection.log >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Unpack the site for full checks
        if: steps.selection.outputs.mode == 'full' && needs.reference.outputs.scoped != 'true'
        run: mkdir public && tar -xf site.tar -C public

      - name: Cache Chromium
        if: steps.selection.outputs.mode != 'none'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}-chromium

      - name: Install Playwright
        if: steps.selection.outputs.mode != 'none'
        run: |
          pip install --quiet "playwright==$PLAYWRIGHT_VERSION" pillow
          # The runner image already has Chromium's libraries; --with-deps adds fonts from the
          # Ubuntu mirror. When the mirror is unreachable, install the browser without them.
          playwright install --with-deps chromium || {
            echo "::warning::Could not install Chromium's system packages; installing the browser without them"
            playwright install chromium
          }

      # Runs its sections in four browsers side by side; each section's time is in the log.
      - name: Designed screens in a browser (overflow, position, layout shift, pause, directory)
        if: steps.selection.outputs.mode != 'none'
        run: python3 scripts/rebrand/check_design.py public --pages changed.json --base "$PREVIEW_BASE" --jobs 4

  axe:
    name: Accessibility rules
    runs-on: ubuntu-22.04
    needs: [build, reference]
    # The reference build is intentionally skipped in full mode.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.reference.result == 'success' || needs.reference.result == 'skipped') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download the branch's build
        uses: actions/download-artifact@v7
        with:
          name: rebrand-preview-${{ github.run_number }}

      - uses: actions/download-artifact@v7
        if: needs.reference.outputs.scoped == 'true'
        with:
          name: rebrand-pr-base-${{ github.run_number }}
          path: base
      - name: Compare pages and bundles
        id: selection
        env:
          SCOPED: ${{ needs.reference.outputs.scoped }}
        run: |
          if [ "$SCOPED" = true ]; then
            tar -xf base/site.tar -C base
            mkdir public
            tar -xf site.tar -C public
            python3 scripts/rebrand/changed_pages.py base public --out changed.json | tee selection.log
          else
            python3 scripts/rebrand/changed_pages.py --full --out changed.json | tee selection.log
          fi
          sed -n 's/^Check mode: /mode=/p' selection.log >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Unpack the site for full checks
        if: steps.selection.outputs.mode == 'full' && needs.reference.outputs.scoped != 'true'
        run: mkdir public && tar -xf site.tar -C public

      - name: Cache Chromium
        if: steps.selection.outputs.mode != 'none'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}-chromium

      - name: Install Playwright
        if: steps.selection.outputs.mode != 'none'
        run: |
          pip install --quiet "playwright==$PLAYWRIGHT_VERSION"
          playwright install --with-deps chromium || {
            echo "::warning::Could not install Chromium's system packages; installing the browser without them"
            playwright install chromium
          }

      - name: Accessibility rules in a browser (axe-core, by WCAG level)
        if: steps.selection.outputs.mode != 'none'
        run: |
          curl -fsSL https://cdn.jsdelivr.net/npm/axe-core@4.11.1/axe.min.js -o "$RUNNER_TEMP/axe.min.js"
          python3 scripts/rebrand/check_axe.py public --pages changed.json --base "$PREVIEW_BASE" --axe "$RUNNER_TEMP/axe.min.js"

  deploy:
    name: Deploy preview
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v7
        with:
          name: rebrand-preview-${{ github.run_number }}

      - name: Unpack the site
        run: mkdir public && tar -xf site.tar -C public

      # No cname: the repository inherits the organisation site's forrt.org domain, which
      # is what puts it at forrt.org/rebrand-doors/. force_orphan keeps one commit, so the
      # repository does not grow by the size of the site on every push.
      - name: Deploy to forrtproject/rebrand-doors
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e
        with:
          personal_token: ${{ secrets.STAGING_GITHUB_TOKEN }}
          external_repository: forrtproject/rebrand-doors
          publish_dir: public
          publish_branch: gh-pages
          force_orphan: true

  checks:
    name: Check results
    runs-on: ubuntu-22.04
    needs: [build, reference, compare, design, axe]
    # Report even when a check job failed; skip only when the build was skipped (fork PRs).
    if: always() && needs.build.result != 'skipped'
    steps:
      - name: Fail if any check failed
        env:
          BUILD: ${{ needs.build.result }}
          REFERENCE: ${{ needs.reference.result }}
          COMPARE_JOB: ${{ needs.compare.result }}
          SOURCE_RULES: ${{ needs.compare.outputs.source-rules }}
          COMPARE: ${{ needs.compare.outputs.compare }}
          LINKS: ${{ needs.compare.outputs.links }}
          SEO: ${{ needs.compare.outputs.seo }}
          DESIGN: ${{ needs.design.result }}
          AXE: ${{ needs.axe.result }}
        run: |
          echo "Build: $BUILD"
          echo "Templates and generated paths: $SOURCE_RULES"
          echo "URL list, structured data and SEO tags: $COMPARE"
          echo "Internal links: $LINKS"
          echo "Built HTML: $SEO"
          echo "Designed screens: $DESIGN"
          echo "Accessibility rules: $AXE"
          [ "$REFERENCE" = success ] || [ "$REFERENCE" = skipped ] || exit 1
          for result in "$BUILD" "$COMPARE_JOB" "$SOURCE_RULES" "$COMPARE" "$LINKS" "$SEO" "$DESIGN" "$AXE"; do
            [ "$result" = "success" ] || exit 1
          done
