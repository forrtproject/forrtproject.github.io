name: Doors preview

# =======================
# Doors Redesign Preview
# =======================
# Purpose: Builds the rebrand-doors branch and publishes it at forrt.org/rebrand-doors/
# Triggers: Pushes to rebrand-doors, PRs into it, the launch PR into main, and manual runs.
# Target: forrtproject/rebrand-doors, on GitHub Pages under the forrt.org domain.
#         Only pushes deploy. A failed check does not hold back the preview.
# Checks: Source, internal links and built HTML run in parallel with the browser checks.
#         Pushes, manual runs and the launch PR also compare with the merge base with main.
#         Eligible PRs into rebrand-doors use a PR base build to scope the browser checks.
#         "Check results" aggregates failures.
# Note: Uses the same data and announcement artifacts as deploy.yaml. Delete this
#       workflow when the redesign launches.

on:
  push:
    branches:
      - rebrand-doors
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - rebrand-doors
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"  # Output is flushed as it is printed, so the log's timestamps show which section is slow.
  HUGO_VERSION: "0.158.0"
  HUGO_EXTENDED: true
  PLAYWRIGHT_VERSION: "1.63.0"
  PREVIEW_BASE: /rebrand-doors/
  PREVIEW_URL: https://forrt.org/rebrand-doors/

concurrency:
  group: rebrand-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inputs:
    name: Resolve build inputs
    runs-on: ubuntu-22.04
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.base_ref == 'rebrand-doors' ||
          (github.base_ref == 'main' && github.head_ref == 'rebrand-doors')))
    permissions:
      actions: read
    outputs:
      data: ${{ steps.inputs.outputs.data }}
      announcements: ${{ steps.inputs.outputs.announcements }}
    steps:
      - name: Pin the production artifacts for both builds
        id: inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for input in data announcements; do
            selected='{"id":null,"run_id":null}'
            case "$input" in
              data) workflow=data-processing.yml ;;
              announcements) workflow=create_announcements.yml ;;
            esac
            artifact=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$input-artifact&per_page=100" \
              | jq -c -s '[.[].artifacts[] | select(.workflow_run.head_branch == "main" and (.expired | not))]
                  | sort_by(.created_at, .id) | reverse | .[] | {id, run_id: .workflow_run.id}')
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              run_id=$(jq -r '.run_id' <<< "$candidate")
              run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
              if jq -e --arg path ".github/workflows/$workflow" \
                '.conclusion == "success" and .path == $path' <<< "$run" >/dev/null; then
                selected=$candidate
                break
              fi
            done <<< "$artifact"
            echo "$input=$selected" >> "$GITHUB_OUTPUT"
          done

  build:
    name: Build
    needs: inputs
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read  # Needed for artifact access
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Let Git report non-ASCII paths unquoted
        run: git config core.quotepath false

      - name: Download data artifact
        if: fromJSON(needs.inputs.outputs.data).id != null
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ fromJSON(needs.inputs.outputs.data).id }}
          run-id: ${{ fromJSON(needs.inputs.outputs.data).run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/artifacts/data

      - name: Download announcements artifact
        if: fromJSON(needs.inputs.outputs.announcements).id != null
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ fromJSON(needs.inputs.outputs.announcements).id }}
          run-id: ${{ fromJSON(needs.inputs.outputs.announcements).run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/artifacts/announcements

      - name: Apply artifacts
        run: |
          scripts/rebrand/apply_artifacts.sh . \
            "$RUNNER_TEMP/artifacts/data" "$RUNNER_TEMP/artifacts/announcements"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: ${{ env.HUGO_EXTENDED }}

      # Keep reusable entries for later builds. Each job restores its own cache snapshot.
      - name: Cache Hugo resources
        uses: actions/cache@v5
        with:
          path: |
            ./resources/_gen
            ${{ runner.temp }}/hugo-cache
          key: hugo-${{ runner.os }}-${{ runner.arch }}-${{ env.HUGO_VERSION }}-head-${{ github.sha }}
          restore-keys: |
            hugo-${{ runner.os }}-${{ runner.arch }}-${{ env.HUGO_VERSION }}-head-

      # HUGO_ENV=staging adds noindex and leaves out Google Analytics.
      - name: Build the branch
        run: hugo --cacheDir "$RUNNER_TEMP/hugo-cache" --minify --cleanDestinationDir --destination public --baseURL "$PREVIEW_URL"
        env:
          HUGO_ENV: staging

      - name: Point root-relative links at the subfolder
        run: python3 scripts/rebrand/preview_paths.py public --base "$PREVIEW_BASE"

      # One file uploads and downloads far faster than the site's thousands.
      - name: Pack the site
        env:
          DATA_INPUT: ${{ needs.inputs.outputs.data }}
          ANNOUNCEMENTS_INPUT: ${{ needs.inputs.outputs.announcements }}
        run: |
          tar -cf site.tar -C public .
          jq -n --argjson data "$DATA_INPUT" --argjson announcements "$ANNOUNCEMENTS_INPUT" \
            '{data: $data, announcements: $announcements, contributors: "artifact"}' > site-inputs.json

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: rebrand-preview-${{ github.run_number }}
          path: site.tar
          retention-days: 1
          compression-level: 1
          overwrite: true  # A rerun reuses the run number.
          if-no-files-found: error

      - name: Upload site input manifest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: rebrand-site-inputs-${{ github.run_number }}
          path: site-inputs.json
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  reference:
    name: Build PR base
    needs: inputs
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request' && github.base_ref == 'rebrand-doors' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'full-checks')
    permissions:
      contents: read
      actions: read
    outputs:
      scoped: ${{ steps.scope.outputs.scoped }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Let Git report non-ASCII paths unquoted
        run: git config core.quotepath false

      - name: Select full or scoped checks
        id: scope
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --filter=blob:none origin "$HEAD_SHA"
          if ! git diff --quiet HEAD "$HEAD_SHA" -- .github/workflows/rebrand-preview.yaml \
              ':(glob)scripts/rebrand/check_*.py' scripts/rebrand/changed_pages.py scripts/rebrand/sample_pages.json \
              static assets content ':(exclude,glob)assets/**/*.css' ':(exclude,glob)assets/**/*.scss' \
              ':(exclude,glob)assets/**/*.js' ':(exclude,glob)content/**/*.md' ':(exclude,glob)content/**/*.markdown'; then
            echo "scoped=false" >> "$GITHUB_OUTPUT"
          else
            echo "scoped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reuse a matching push build
        if: steps.scope.outputs.scoped == 'true'
        id: reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          DATA_INPUT: ${{ needs.inputs.outputs.data }}
          ANNOUNCEMENTS_INPUT: ${{ needs.inputs.outputs.announcements }}
        run: |
          # Require the exact base commit and the same immutable input artifacts.
          if ! run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow rebrand-preview.yaml \
            --branch "$BASE_BRANCH" --event push --status success --commit "$BASE_SHA" \
            --limit 1 --json databaseId,number --jq '.[0] | select(. != null) | [.databaseId, .number] | @tsv'); then
            echo "::warning::Could not look up the base push build"
            exit 0
          fi
          if [ -z "$run" ]; then
            echo "No successful push build for the PR base"
            exit 0
          fi
          read -r run_id run_number <<< "$run"
          if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "rebrand-site-inputs-$run_number" --dir "$RUNNER_TEMP/base-build"; then
            echo "Base push input manifest unavailable"
            exit 0
          fi
          if ! jq -e --argjson data "$DATA_INPUT" --argjson announcements "$ANNOUNCEMENTS_INPUT" \
            '.data == $data and .announcements == $announcements and .contributors == "artifact"' \
            "$RUNNER_TEMP/base-build/site-inputs.json" >/dev/null; then
            echo "Base push artifact has different or unrecorded inputs"
            exit 0
          fi
          if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "rebrand-preview-$run_number" --dir "$RUNNER_TEMP/base-build"; then
            echo "Base push site artifact unavailable"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/base-build/public"
          if ! tar -xf "$RUNNER_TEMP/base-build/site.tar" -C "$RUNNER_TEMP/base-build/public" \
            --wildcards '*.html' '*.css' '*.js' || [ ! -f "$RUNNER_TEMP/base-build/public/index.html" ]; then
            echo "Base push site archive is incomplete"
            exit 0
          fi
          mv "$RUNNER_TEMP/base-build/public" public
          echo "Reused base push build from run $run_id"
          echo "reused=true" >> "$GITHUB_OUTPUT"

      - name: Download data artifact
        if: steps.scope.outputs.scoped == 'true' && steps.reuse.outputs.reused != 'true' && fromJSON(needs.inputs.outputs.data).id != null
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ fromJSON(needs.inputs.outputs.data).id }}
          run-id: ${{ fromJSON(needs.inputs.outputs.data).run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/artifacts/data

      - name: Download announcements artifact
        if: steps.scope.outputs.scoped == 'true' && steps.reuse.outputs.reused != 'true' && fromJSON(needs.inputs.outputs.announcements).id != null
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ fromJSON(needs.inputs.outputs.announcements).id }}
          run-id: ${{ fromJSON(needs.inputs.outputs.announcements).run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/artifacts/announcements

      - name: Apply artifacts
        if: steps.scope.outputs.scoped == 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          scripts/rebrand/apply_artifacts.sh . \
            "$RUNNER_TEMP/artifacts/data" "$RUNNER_TEMP/artifacts/announcements"

      - name: Setup Hugo
        if: steps.scope.outputs.scoped == 'true' && steps.reuse.outputs.reused != 'true'
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: ${{ env.HUGO_EXTENDED }}

      - name: Cache Hugo resources
        if: steps.scope.outputs.scoped == 'true' && steps.reuse.outputs.reused != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ./resources/_gen
            ${{ runner.temp }}/hugo-cache
          key: hugo-${{ runner.os }}-${{ runner.arch }}-${{ env.HUGO_VERSION }}-base-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            hugo-${{ runner.os }}-${{ runner.arch }}-${{ env.HUGO_VERSION }}-base-
            hugo-${{ runner.os }}-${{ runner.arch }}-${{ env.HUGO_VERSION }}-head-${{ github.event.pull_request.base.sha }}
            hugo-${{ runner.os }}-${{ runner.arch }}-${{ env.HUGO_VERSION }}-head-

      # HUGO_ENV=staging adds noindex and leaves out Google Analytics.
      - name: Build the PR base
        if: steps.scope.outputs.scoped == 'true' && steps.reuse.outputs.reused != 'true'
        run: hugo --cacheDir "$RUNNER_TEMP/hugo-cache" --minify --destination public --baseURL "$PREVIEW_URL"
        env:
          HUGO_ENV: staging

      - name: Point root-relative links at the subfolder
        if: steps.scope.outputs.scoped == 'true' && steps.reuse.outputs.reused != 'true'
        run: python3 scripts/rebrand/preview_paths.py public --base "$PREVIEW_BASE"

      - name: Pack pages and bundles
        if: steps.scope.outputs.scoped == 'true'
        working-directory: public
        run: find . -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -print0 | tar --null -T - -cf ../site.tar

      - name: Upload site artifact
        if: steps.scope.outputs.scoped == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rebrand-pr-base-${{ github.run_number }}
          path: site.tar
          retention-days: 1
          compression-level: 1
          overwrite: true  # A rerun reuses the run number.
          if-no-files-found: error

  main-reference:
    name: Build main reference
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: ubuntu-22.04
    needs: inputs
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Let Git report non-ASCII paths unquoted
        run: git config core.quotepath false

      # Use the actual PR head on launch. GitHub's test merge already includes main.
      - name: Check out the merge base with main as the reference
        env:
          MAIN: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          merge_base=$(git merge-base "$MAIN" "$CANDIDATE")
          git worktree add --detach "$RUNNER_TEMP/reference" "$merge_base"

      - name: Download data artifact
        if: fromJSON(needs.inputs.outputs.data).id != null
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ fromJSON(needs.inputs.outputs.data).id }}
          run-id: ${{ fromJSON(needs.inputs.outputs.data).run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/artifacts/data

      - name: Download announcements artifact
        if: fromJSON(needs.inputs.outputs.announcements).id != null
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ fromJSON(needs.inputs.outputs.announcements).id }}
          run-id: ${{ fromJSON(needs.inputs.outputs.announcements).run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/artifacts/announcements

      - name: Apply the same artifacts to the reference
        run: |
          scripts/rebrand/apply_artifacts.sh "$RUNNER_TEMP/reference" \
            "$RUNNER_TEMP/artifacts/data" "$RUNNER_TEMP/artifacts/announcements"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: ${{ env.HUGO_EXTENDED }}

      - name: Cache Hugo resources
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/reference/resources/_gen
            ${{ runner.temp }}/hugo-cache
          key: hugo-${{ runner.os }}-${{ runner.arch }}-${{ env.HUGO_VERSION }}-main-${{ github.sha }}
          restore-keys: |
            hugo-${{ runner.os }}-${{ runner.arch }}-${{ env.HUGO_VERSION }}-main-

      - name: Build the reference from the same data
        working-directory: ${{ runner.temp }}/reference
        run: |
          hugo --cacheDir "$RUNNER_TEMP/hugo-cache" --minify --destination "$RUNNER_TEMP/public-reference" --baseURL "$PREVIEW_URL"
          python3 "$GITHUB_WORKSPACE/scripts/rebrand/preview_paths.py" "$RUNNER_TEMP/public-reference" --base "$PREVIEW_BASE"
        env:
          HUGO_ENV: staging

      - name: Pack the reference site
        run: tar -cf reference.tar -C "$RUNNER_TEMP/public-reference" .

      - name: Upload the reference site
        uses: actions/upload-artifact@v7
        with:
          name: rebrand-main-reference-${{ github.run_number }}
          path: reference.tar
          retention-days: 1
          compression-level: 1
          overwrite: true
          if-no-files-found: error

  compare:
    name: Compare with main
    runs-on: ubuntu-22.04
    needs: [build, main-reference]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download the reference site
        uses: actions/download-artifact@v7
        with:
          name: rebrand-main-reference-${{ github.run_number }}

      - name: Unpack the reference site
        run: mkdir "$RUNNER_TEMP/public-reference" && tar -xf reference.tar -C "$RUNNER_TEMP/public-reference"

      - name: Download the branch's build
        uses: actions/download-artifact@v7
        with:
          name: rebrand-preview-${{ github.run_number }}

      - name: Unpack the site
        run: mkdir public && tar -xf site.tar -C public

      - name: URL list, structured data and SEO tags against the reference
        run: python3 scripts/rebrand/compare_builds.py "$RUNNER_TEMP/public-reference" public

  site-checks:
    name: Source and built site checks
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      contents: read
    outputs:
      source-rules: ${{ steps.source-rules.outcome }}
      links: ${{ steps.links.outcome }}
      seo: ${{ steps.seo.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Let Git report non-ASCII paths unquoted
        run: git config core.quotepath false

      - name: Download the branch's build
        uses: actions/download-artifact@v7
        with:
          name: rebrand-preview-${{ github.run_number }}

      - name: Unpack the site
        run: mkdir public && tar -xf site.tar -C public

      - name: Templates and generated paths
        id: source-rules
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: python3 scripts/rebrand/check_source_rules.py --base "$BASE_SHA"

      - name: Internal links
        id: links
        continue-on-error: true
        run: python3 scripts/rebrand/check_internal_links.py public --base "$PREVIEW_BASE"

      - name: Built HTML (headings, conditional assets, image alt and dimensions)
        id: seo
        continue-on-error: true
        run: python3 scripts/check_seo_html.py public

  design:
    name: Designed screens
    runs-on: ubuntu-22.04
    needs: [build, reference]
    # The reference build is intentionally skipped in full mode.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.reference.result == 'success' || needs.reference.result == 'skipped') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download the branch's build
        uses: actions/download-artifact@v7
        with:
          name: rebrand-preview-${{ github.run_number }}

      - uses: actions/download-artifact@v7
        if: needs.reference.outputs.scoped == 'true'
        with:
          name: rebrand-pr-base-${{ github.run_number }}
          path: base
      - name: Compare pages and bundles
        id: selection
        env:
          SCOPED: ${{ needs.reference.outputs.scoped }}
        run: |
          if [ "$SCOPED" = true ]; then
            tar -xf base/site.tar -C base
            mkdir public
            tar -xf site.tar -C public
            python3 scripts/rebrand/changed_pages.py base public --out changed.json | tee selection.log
          else
            python3 scripts/rebrand/changed_pages.py --full --out changed.json | tee selection.log
          fi
          sed -n 's/^Check mode: /mode=/p' selection.log >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Unpack the site for full checks
        if: steps.selection.outputs.mode == 'full' && needs.reference.outputs.scoped != 'true'
        run: mkdir public && tar -xf site.tar -C public

      - name: Cache Chromium
        if: steps.selection.outputs.mode != 'none'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}-chromium

      - name: Install Playwright
        if: steps.selection.outputs.mode != 'none'
        run: |
          pip install --quiet "playwright==$PLAYWRIGHT_VERSION" pillow
          # The runner image already has Chromium's libraries; --with-deps adds fonts from the
          # Ubuntu mirror. When the mirror is unreachable, install the browser without them.
          playwright install --with-deps chromium || {
            echo "::warning::Could not install Chromium's system packages; installing the browser without them"
            playwright install chromium
          }

      # Runs its sections in four browsers side by side; each section's time is in the log.
      - name: Designed screens in a browser (overflow, position, layout shift, pause, directory)
        if: steps.selection.outputs.mode != 'none'
        run: python3 scripts/rebrand/check_design.py public --pages changed.json --base "$PREVIEW_BASE" --jobs 4

  axe:
    name: Accessibility rules
    runs-on: ubuntu-22.04
    needs: [build, reference]
    # The reference build is intentionally skipped in full mode.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.reference.result == 'success' || needs.reference.result == 'skipped') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download the branch's build
        uses: actions/download-artifact@v7
        with:
          name: rebrand-preview-${{ github.run_number }}

      - uses: actions/download-artifact@v7
        if: needs.reference.outputs.scoped == 'true'
        with:
          name: rebrand-pr-base-${{ github.run_number }}
          path: base
      - name: Compare pages and bundles
        id: selection
        env:
          SCOPED: ${{ needs.reference.outputs.scoped }}
        run: |
          if [ "$SCOPED" = true ]; then
            tar -xf base/site.tar -C base
            mkdir public
            tar -xf site.tar -C public
            python3 scripts/rebrand/changed_pages.py base public --out changed.json | tee selection.log
          else
            python3 scripts/rebrand/changed_pages.py --full --out changed.json | tee selection.log
          fi
          sed -n 's/^Check mode: /mode=/p' selection.log >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Unpack the site for full checks
        if: steps.selection.outputs.mode == 'full' && needs.reference.outputs.scoped != 'true'
        run: mkdir public && tar -xf site.tar -C public

      - name: Cache Chromium
        if: steps.selection.outputs.mode != 'none'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}-chromium

      - name: Install Playwright
        if: steps.selection.outputs.mode != 'none'
        run: |
          pip install --quiet "playwright==$PLAYWRIGHT_VERSION"
          playwright install --with-deps chromium || {
            echo "::warning::Could not install Chromium's system packages; installing the browser without them"
            playwright install chromium
          }

      - name: Accessibility rules in a browser (axe-core, by WCAG level)
        if: steps.selection.outputs.mode != 'none'
        run: |
          curl -fsSL https://cdn.jsdelivr.net/npm/axe-core@4.11.1/axe.min.js -o "$RUNNER_TEMP/axe.min.js"
          python3 scripts/rebrand/check_axe.py public --pages changed.json --base "$PREVIEW_BASE" --axe "$RUNNER_TEMP/axe.min.js"

  deploy:
    name: Deploy preview
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name == 'push'
    timeout-minutes: 15
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v7
        with:
          name: rebrand-preview-${{ github.run_number }}

      - name: Unpack the site
        run: mkdir public && tar -xf site.tar -C public

      # No cname: the repository inherits the organisation site's forrt.org domain, which
      # is what puts it at forrt.org/rebrand-doors/. force_orphan keeps one commit, so the
      # repository does not grow by the size of the site on every push.
      - name: Deploy to forrtproject/rebrand-doors
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e
        with:
          personal_token: ${{ secrets.STAGING_GITHUB_TOKEN }}
          external_repository: forrtproject/rebrand-doors
          publish_dir: public
          publish_branch: gh-pages
          force_orphan: true

  checks:
    name: Check results
    runs-on: ubuntu-22.04
    needs: [inputs, build, reference, main-reference, compare, site-checks, design, axe, deploy]
    # Run even if a required job was cancelled or skipped.
    if: >-
      always() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (github.base_ref == 'rebrand-doors' ||
            (github.base_ref == 'main' && github.head_ref == 'rebrand-doors'))))
    timeout-minutes: 2
    steps:
      - name: Fail if any check failed
        env:
          INPUTS: ${{ needs.inputs.result }}
          BUILD: ${{ needs.build.result }}
          PR_BASE: ${{ needs.reference.result }}
          EXPECTED_PR_BASE: ${{ github.event_name == 'pull_request' && github.base_ref == 'rebrand-doors' && !contains(github.event.pull_request.labels.*.name, 'full-checks') && 'success' || 'skipped' }}
          MAIN_REFERENCE: ${{ needs.main-reference.result }}
          COMPARE_JOB: ${{ needs.compare.result }}
          EXPECTED_COMPARISON: ${{ (github.event_name != 'pull_request' || github.base_ref == 'main') && 'success' || 'skipped' }}
          SOURCE_RULES: ${{ needs.site-checks.outputs.source-rules }}
          SITE_CHECKS: ${{ needs.site-checks.result }}
          LINKS: ${{ needs.site-checks.outputs.links }}
          SEO: ${{ needs.site-checks.outputs.seo }}
          DESIGN: ${{ needs.design.result }}
          AXE: ${{ needs.axe.result }}
          DEPLOY: ${{ needs.deploy.result }}
          EXPECTED_DEPLOY: ${{ github.event_name == 'push' && 'success' || 'skipped' }}
        run: |
          failed=0
          check_result() {
            local name=$1 result=$2 expected=${3:-success}
            echo "$name: $result (expected $expected)"
            if [ "$result" != "$expected" ]; then
              failed=1
            fi
          }
          check_result "Resolve build inputs" "$INPUTS"
          check_result "Build" "$BUILD"
          check_result "Build PR base" "$PR_BASE" "$EXPECTED_PR_BASE"
          check_result "Build main reference" "$MAIN_REFERENCE" "$EXPECTED_COMPARISON"
          check_result "Compare with main" "$COMPARE_JOB" "$EXPECTED_COMPARISON"
          check_result "Source and built site checks" "$SITE_CHECKS"
          check_result "Templates and generated paths" "$SOURCE_RULES"
          check_result "Internal links" "$LINKS"
          check_result "Built HTML" "$SEO"
          check_result "Designed screens" "$DESIGN"
          check_result "Accessibility rules" "$AXE"
          check_result "Deploy preview" "$DEPLOY" "$EXPECTED_DEPLOY"
          exit "$failed"
