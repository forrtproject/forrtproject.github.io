name: Doors preview

# =======================
# Doors Redesign Preview
# =======================
# Purpose: Builds the rebrand-doors branch and publishes it at forrt.org/rebrand-doors/
# Triggers: Push to rebrand-doors, and PRs into it (checks only, no deployment)
# Target: forrtproject/rebrand-doors, on GitHub Pages under the forrt.org domain
# Checks: Every run also builds the merge base with main from the same data, then compares
#         the two builds.
#         A failed check shows on the run but does not hold back the preview.
# Layout: "Build" builds the branch and shares it as an artifact. Three jobs then check it
#         side by side: the comparison with main, the designed screens and the accessibility
#         rules. "Check results" fails if any of them did.
# Note: Uses the same data and announcement artifacts as deploy.yaml. Delete this
#       workflow when the redesign launches.

on:
  push:
    branches:
      - rebrand-doors
  pull_request:
    branches:
      - rebrand-doors

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"  # Output is flushed as it is printed, so the log's timestamps show which section is slow.
  HUGO_VERSION: "0.158.0"
  HUGO_EXTENDED: true
  PREVIEW_BASE: /rebrand-doors/
  PREVIEW_URL: https://forrt.org/rebrand-doors/

concurrency:
  group: rebrand-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    # Fork PRs get no artifacts token and have no preview to update.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      actions: read  # Needed for artifact access
    steps:
      # Full history for Hugo's Git dates, with file contents fetched only for the commit
      # checked out (as in staging-aggregate.yaml).
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      # See deploy.yaml: Git quotes non-ASCII paths unless this is off, and Hugo
      # then finds no date for them.
      - name: Let Git report non-ASCII paths unquoted
        run: git config core.quotepath false

      # =======================
      # Artifacts, as in deploy.yaml
      # =======================
      - name: Download data artifact
        uses: dawidd6/action-download-artifact@07ab29fd4a977ae4d2b275087cf67563dfdf0295
        continue-on-error: true
        with:
          workflow: data-processing.yml
          name: data-artifact
          path: ${{ runner.temp }}/artifacts/data
          github_token: ${{ secrets.GITHUB_TOKEN }}
          search_artifacts: true
          branch: main  # as in deploy.yaml: only main's runs, never a branch test run (#960)
          if_no_artifact_found: warn

      - name: Download announcements artifact
        uses: dawidd6/action-download-artifact@07ab29fd4a977ae4d2b275087cf67563dfdf0295
        continue-on-error: true
        with:
          workflow: create_announcements.yml
          name: announcements-artifact
          path: ${{ runner.temp }}/artifacts/announcements
          github_token: ${{ secrets.GITHUB_TOKEN }}
          search_artifacts: true
          branch: main  # as in deploy.yaml: only main's runs, never a branch test run (#960)
          if_no_artifact_found: warn

      - name: Apply artifacts
        run: |
          scripts/rebrand/apply_artifacts.sh . \
            "$RUNNER_TEMP/artifacts/data" "$RUNNER_TEMP/artifacts/announcements"

      # The data artifact's Contributors page comes from main's generator, which writes the old
      # markup until the redesign launches. Regenerate it with this branch's generator, from the
      # contributor cache the same artifact carries (no credentials needed). Only the branch
      # build does this; the reference keeps main's page.
      - name: Rebuild the Contributors page with this branch's generator
        run: |
          pip install --quiet numpy==1.24.4 pandas==2.0.3 python-dotenv  # pinned as in requirements.txt
          python3 scripts/forrt_contribs/tenzing.py
          mv scripts/forrt_contribs/tenzing.md content/contributors/tenzing.md

      # "Compare with main" builds the reference from these same files, not from whatever
      # data run is newest by the time it starts.
      - name: Pack the artifacts for the reference build
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts/data" "$RUNNER_TEMP/artifacts/announcements"
          tar -cf inputs.tar -C "$RUNNER_TEMP" artifacts

      - name: Upload the artifacts for the reference build
        uses: actions/upload-artifact@v7
        with:
          name: rebrand-inputs-${{ github.run_number }}
          path: inputs.tar
          retention-days: 1
          overwrite: true
          if-no-files-found: error

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: ${{ env.HUGO_EXTENDED }}

      # HUGO_ENV=staging adds noindex and leaves out Google Analytics.
      - name: Build the branch
        run: hugo --gc --minify --cleanDestinationDir --destination public --baseURL "$PREVIEW_URL"
        env:
          HUGO_ENV: staging

      - name: Point root-relative links at the subfolder
        run: python3 scripts/rebrand/preview_paths.py public --base "$PREVIEW_BASE"

      # One file uploads and downloads far faster than the site's thousands.
      - name: Pack the site
        run: tar -cf site.tar -C public .

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: rebrand-preview-${{ github.run_number }}
          path: site.tar
          retention-days: 1
          compression-level: 1
          overwrite: true  # A rerun reuses the run number.
          if-no-files-found: error

  compare:
    name: Compare with main
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      contents: read
      actions: read  # Needed for artifact access
    outputs:
      source-rules: ${{ steps.source-rules.outcome }}
      compare: ${{ steps.compare.outcome }}
      links: ${{ steps.links.outcome }}
      seo: ${{ steps.seo.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Let Git report non-ASCII paths unquoted
        run: git config core.quotepath false

      # The point where the branch last took main, not main's tip: otherwise anything landing
      # on main shows up here as a change, until main is next merged in.
      - name: Check out the merge base with main as the reference
        run: git worktree add --detach "$RUNNER_TEMP/reference" "$(git merge-base origin/main HEAD)"

      - name: Download the artifacts the branch was built with
        uses: actions/download-artifact@v7
        with:
          name: rebrand-inputs-${{ github.run_number }}
          path: ${{ runner.temp }}

      - name: Apply the same artifacts to the reference
        run: |
          tar -xf "$RUNNER_TEMP/inputs.tar" -C "$RUNNER_TEMP"
          scripts/rebrand/apply_artifacts.sh "$RUNNER_TEMP/reference" \
            "$RUNNER_TEMP/artifacts/data" "$RUNNER_TEMP/artifacts/announcements"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: ${{ env.HUGO_EXTENDED }}

      - name: Build the reference from the same data
        working-directory: ${{ runner.temp }}/reference
        run: |
          hugo --gc --minify --destination "$RUNNER_TEMP/public-reference" --baseURL "$PREVIEW_URL"
          python3 "$GITHUB_WORKSPACE/scripts/rebrand/preview_paths.py" "$RUNNER_TEMP/public-reference" --base "$PREVIEW_BASE"
        env:
          HUGO_ENV: staging

      - name: Download the branch's build
        uses: actions/download-artifact@v7
        with:
          name: rebrand-preview-${{ github.run_number }}

      - name: Unpack the site
        run: mkdir public && tar -xf site.tar -C public

      - name: Templates and generated paths
        id: source-rules
        continue-on-error: true
        run: python3 scripts/rebrand/check_source_rules.py --base origin/main

      - name: URL list, structured data and SEO tags against the reference
        id: compare
        continue-on-error: true
        run: python3 scripts/rebrand/compare_builds.py "$RUNNER_TEMP/public-reference" public

      - name: Internal links
        id: links
        continue-on-error: true
        run: |
          python3 scripts/rebrand/check_internal_links.py public --base "$PREVIEW_BASE" \
            --reference "$RUNNER_TEMP/public-reference"

      - name: Built HTML (headings, conditional assets, image alt and dimensions)
        id: seo
        continue-on-error: true
        run: python3 scripts/check_seo_html.py public

  design:
    name: Designed screens
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download the branch's build
        uses: actions/download-artifact@v7
        with:
          name: rebrand-preview-${{ github.run_number }}

      - name: Unpack the site
        run: mkdir public && tar -xf site.tar -C public

      - name: Install Playwright
        run: |
          pip install --quiet playwright==1.63.0 pillow
          # The runner image already has Chromium's libraries; --with-deps adds fonts from the
          # Ubuntu mirror. When the mirror is unreachable, install the browser without them.
          playwright install --with-deps chromium || {
            echo "::warning::Could not install Chromium's system packages; installing the browser without them"
            playwright install chromium
          }

      # Runs its sections in four browsers side by side; each section's time is in the log.
      - name: Designed screens in a browser (overflow, position, layout shift, pause, directory)
        run: python3 scripts/rebrand/check_design.py public --base "$PREVIEW_BASE" --jobs 4

  axe:
    name: Accessibility rules
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download the branch's build
        uses: actions/download-artifact@v7
        with:
          name: rebrand-preview-${{ github.run_number }}

      - name: Unpack the site
        run: mkdir public && tar -xf site.tar -C public

      - name: Install Playwright
        run: |
          pip install --quiet playwright==1.63.0
          playwright install --with-deps chromium || {
            echo "::warning::Could not install Chromium's system packages; installing the browser without them"
            playwright install chromium
          }

      - name: Accessibility rules in a browser (axe-core, by WCAG level)
        run: |
          curl -fsSL https://cdn.jsdelivr.net/npm/axe-core@4.11.1/axe.min.js -o "$RUNNER_TEMP/axe.min.js"
          python3 scripts/rebrand/check_axe.py public --base "$PREVIEW_BASE" --axe "$RUNNER_TEMP/axe.min.js"

  deploy:
    name: Deploy preview
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v7
        with:
          name: rebrand-preview-${{ github.run_number }}

      - name: Unpack the site
        run: mkdir public && tar -xf site.tar -C public

      # No cname: the repository inherits the organisation site's forrt.org domain, which
      # is what puts it at forrt.org/rebrand-doors/. force_orphan keeps one commit, so the
      # repository does not grow by the size of the site on every push.
      - name: Deploy to forrtproject/rebrand-doors
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e
        with:
          personal_token: ${{ secrets.STAGING_GITHUB_TOKEN }}
          external_repository: forrtproject/rebrand-doors
          publish_dir: public
          publish_branch: gh-pages
          force_orphan: true

  checks:
    name: Check results
    runs-on: ubuntu-22.04
    needs: [build, compare, design, axe]
    # Report even when a check job failed; skip only when the build was skipped (fork PRs).
    if: always() && needs.build.result != 'skipped'
    steps:
      - name: Fail if any check failed
        env:
          BUILD: ${{ needs.build.result }}
          SOURCE_RULES: ${{ needs.compare.outputs.source-rules }}
          COMPARE: ${{ needs.compare.outputs.compare }}
          LINKS: ${{ needs.compare.outputs.links }}
          SEO: ${{ needs.compare.outputs.seo }}
          DESIGN: ${{ needs.design.result }}
          AXE: ${{ needs.axe.result }}
        run: |
          echo "Build: $BUILD"
          echo "Templates and generated paths: $SOURCE_RULES"
          echo "URL list, structured data and SEO tags: $COMPARE"
          echo "Internal links: $LINKS"
          echo "Built HTML: $SEO"
          echo "Designed screens: $DESIGN"
          echo "Accessibility rules: $AXE"
          for result in "$BUILD" "$SOURCE_RULES" "$COMPARE" "$LINKS" "$SEO" "$DESIGN" "$AXE"; do
            [ "$result" = "success" ] || exit 1
          done
