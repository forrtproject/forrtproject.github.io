name: Google Forms Check

# =======================
# Keep the site's forms in step with Google
# =======================
# Purpose: The site posts answers to the Google Forms in assets/gforms/ without seeing Google's
#          reply, so a form edited in Google can lose responses unnoticed.
# Triggers: Hourly, manual dispatch, and pull requests that touch the definitions or this check
# Reports: Opens one issue and a pull request with the updated definitions, and closes the issue
#          once the definitions match again

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/gforms/**'
      - 'scripts/build_google_forms.py'
      - '.github/workflows/google-forms-check.yml'

permissions:
  contents: read

env:
  ISSUE_TITLE: A Google Form on forrt.org has changed
  SYNC_BRANCH: google-forms-sync

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # A pull request opened with the default token would not start the other checks.
          token: ${{ secrets.FORRT_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compare the definitions with the live forms
        id: compare
        run: |
          set +e
          python3 scripts/build_google_forms.py --check 2>&1 | tee check-output.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Propose updated definitions
        id: propose
        if: steps.compare.outputs.code == '1' && github.event_name != 'pull_request'
        continue-on-error: true  # The issue below must still be opened.
        env:
          GH_TOKEN: ${{ secrets.FORRT_PAT || github.token }}
        run: |
          # Writes nothing if a form can no longer be reproduced; the issue then reports why.
          python3 scripts/build_google_forms.py || true
          if [ -z "$(git status --porcelain -- assets/gforms)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$SYNC_BRANCH"
          git add assets/gforms
          git commit -m "Update Google Form definitions"
          git push --force origin "$SYNC_BRANCH"
          url=$(gh pr list --head "$SYNC_BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$url" ]; then
            url=$(gh pr create --base main --head "$SYNC_BRANCH" \
              --title "Update Google Form definitions" \
              --body "A Google Form shown on forrt.org changed. This updates the site's copy to match. Merge it soon: until then, Google may discard responses sent from the site.")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Report the change in an issue
        if: steps.compare.outputs.code == '1' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.propose.outputs.url }}
        run: |
          {
            echo "A Google Form shown on forrt.org no longer matches the copy the site uses. Until this is fixed, Google may discard responses sent from the site, and visitors are not told."
            echo
            echo '```'
            cat check-output.txt
            echo '```'
            echo
            if [ -n "$PR_URL" ]; then
              echo "**To fix:** review and merge $PR_URL."
            else
              echo "**To fix:** the site cannot reproduce this form automatically. Undo the change in Google, or update \`scripts/build_google_forms.py\` and \`layouts/partials/google_form.html\`."
            fi
          } > issue-body.md
          number=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file issue-body.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file issue-body.md --assignee LukasWallrich
          fi

      - name: Close the issue once the forms match
        if: steps.compare.outputs.code == '0' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "The site's copy matches the live forms again."
          fi

      - name: Fail the run unless the forms match
        if: steps.compare.outputs.code != '0'
        run: exit 1
