name: deploy

# =======================
# FORRT Website Deployment
# =======================
# Purpose: Build and deploy the FORRT Hugo website to production
# Triggers: Push to main, manual dispatch, or data updates
# Target: Production (forrt.org)
# Note: Staging deployments are handled by staging-aggregate.yaml

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [data-update]

# Note: PR staging deployments are handled by staging-aggregate.yaml
# This workflow focuses on production deployments

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read  # Needed for artifact access
    env:
      HUGO_VERSION: "0.158.0"
      HUGO_EXTENDED: true
    steps:
      # =======================
      # Repository Setup
      # =======================
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Hugo derives page dates from `git log --name-only`, and Git quotes
      # non-ASCII paths (glossary terms, accented resource titles) unless this
      # is off. Quoted paths never match, leaving those pages without a date.
      - name: Let Git report non-ASCII paths unquoted
        run: git config core.quotepath false

      # =======================
      # Data Artifact Retrieval
      # =======================
      # The repository contains a generated seed copy of curated resources.
      # Remove it before overlaying the artifact so rows removed from the
      # source sheet cannot survive in the deployed site.
      - name: Clear generated curated resources
        run: |
          find content/curated_resources -maxdepth 1 -type f ! -name '_index.md' -delete

      - name: Try to download data artifact
        id: download-artifact
        uses: dawidd6/action-download-artifact@a92c7ae74cf1df8810783758581e485ac3aaa309 # v28
        continue-on-error: true
        with:
          workflow: data-processing.yml
          name: data-artifact
          path: .
          github_token: ${{ secrets.GITHUB_TOKEN }}
          search_artifacts: true
          branch: main  # only main's runs feed deploys; branch test runs must not (#960)
          if_no_artifact_found: fail  # continue-on-error is set; failure triggers the fallback below

      # =======================
      # Data Processing (Fallback)
      # =======================
      - name: Run data processing if artifact missing
        id: data-processing
        if: steps.download-artifact.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.FORRT_PAT }}
        run: |
          set -e

          # If this is a pull request, we can't easily trigger the external workflow and wait for it
          # in the same way (or maybe we can, but let's stick to the plan).
          # Actually, for PRs, we might want to just warn and proceed if it's not critical, 
          # OR trigger it if we really need the data. 
          # The original logic skipped it for PRs.
          
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::Data artifact missing in PR. Skipping trigger."
            echo "data_processing_triggered=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Always regenerate from main: deploys use main's data only (#960)
          REF="main"

          # The run this job dispatches is the first one newer than any that exists now
          RUNS_URL="https://api.github.com/repos/${{ github.repository }}/actions/workflows/data-processing.yml/runs?event=workflow_dispatch&branch=$REF&per_page=100"
          BEFORE=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$RUNS_URL" | jq '[.workflow_runs[].id] | max // 0')
          echo "🚀 Dispatching data-processing workflow for ref: $REF because artifact was missing"
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/data-processing.yml/dispatches" \
            -d "{\"ref\":\"$REF\", \"inputs\": {\"skip_deploy\": \"true\"}}" \
            || { echo "::error::Failed to dispatch data-processing workflow"; exit 1; }
            
          echo "data_processing_triggered=true" >> $GITHUB_OUTPUT

          echo "⏳ Waiting for data-processing workflow run to start and complete..."

          attempts=0
          max_attempts=180
          interval=10
          
          # Wait a bit for the run to be created
          sleep 10

          while [ $attempts -lt $max_attempts ]; do
            # The first run created after the dispatch is ours
            runs_json=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              "$RUNS_URL" | jq --argjson before "$BEFORE" '{workflow_runs: [.workflow_runs[] | select(.id > $before)] | sort_by(.id)}')
            
            run_id=$(echo "$runs_json" | jq -r '.workflow_runs[0].id')
            status=$(echo "$runs_json" | jq -r '.workflow_runs[0].status')
            conclusion=$(echo "$runs_json" | jq -r '.workflow_runs[0].conclusion')
            
            if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
              echo "Tracking data-processing run: $run_id (Status: $status)"
              
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "✅ data-processing workflow completed successfully"
                  echo "run_id=$run_id" >> $GITHUB_OUTPUT
                  exit 0
                else
                  echo "::error::data-processing workflow completed with conclusion: $conclusion"
                  exit 1
                fi
              fi
            fi

            attempts=$((attempts + 1))
            sleep $interval
          done

          echo "::error::Timed out waiting for data-processing workflow"
          exit 1
        
      # =======================
      # Data Artifact Retrieval (Retry)
      # =======================
      - name: Download data artifact (Retry)
        id: download-artifact-retry
        if: steps.download-artifact.outcome == 'failure' && steps.data-processing.outputs.data_processing_triggered == 'true'
        uses: dawidd6/action-download-artifact@a92c7ae74cf1df8810783758581e485ac3aaa309 # v28
        with:
          workflow: data-processing.yml
          name: data-artifact
          path: .
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ steps.data-processing.outputs.run_id }}

      # =======================
      # Announcements (generated by create_announcements.yml, delivered as an artifact)
      # =======================
      - name: Download announcements artifact
        id: download-announcements
        uses: dawidd6/action-download-artifact@a92c7ae74cf1df8810783758581e485ac3aaa309 # v28
        continue-on-error: true
        with:
          workflow: create_announcements.yml
          name: announcements-artifact
          path: .announcements
          github_token: ${{ secrets.GITHUB_TOKEN }}
          search_artifacts: true
          branch: main  # only main's runs feed deploys; branch test runs must not (#960)
          if_no_artifact_found: warn

      - name: Apply announcements
        if: steps.download-announcements.outcome == 'success'
        run: |
          if [ -f .announcements/announcements.tar.gz ]; then
            echo "📥 Applying announcement posts from artifact..."
            # The artifact holds the full current set of announcements. Replace
            # the committed seed bundles entirely so a post removed from the
            # sheet (or set to Show = "no") is taken down rather than lingering
            # from the checkout — tar extraction adds files but never deletes
            # ones the archive no longer contains. The section index and any
            # non-bundle files are preserved. Only runs when we actually have an
            # artifact to apply, so announcements are never wiped without a
            # replacement.
            find content/post -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
            tar xzf .announcements/announcements.tar.gz
          else
            echo "::warning::announcements artifact present but tarball missing; skipping."
          fi

      # =======================
      # Hugo Build Environment
      # =======================
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: ${{ env.HUGO_EXTENDED }}

      # =======================
      # Website Build
      # =======================
      - name: Build site
        run: |
          hugo --gc --minify --cleanDestinationDir --destination public
        env:
          HUGO_ENV: production

      # =======================
      # Sitemap Quality Check
      # =======================
      # Reports pages missing a <lastmod>, a timestamp stamped on most of the
      # site, and a sample of pages whose date disagrees with their source
      # (front-matter lastmod or Git). Warns only: a stale sitemap date must
      # not block a deployment.
      - name: Check sitemap lastmod
        continue-on-error: true
        run: python3 scripts/check_sitemap_lastmod.py public/sitemap.xml --compare-source --sample 200

      # =======================
      # Deployment Artifact
      #========================================
      # Upload built website as artifact for deployment
      #========================================
      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: forrt-website-${{ github.run_number }}
          path: public/
          retention-days: 1

      # =======================
      # Built HTML Regression Checks
      # =======================
      - name: Check built HTML (headings, conditional assets, image alt and dimensions, meta descriptions)
        run: |
          python3 scripts/check_seo_html.py public

  #========================================
  # Deploy website to production GitHub Pages
  # Note: Staging deployments are handled by staging-aggregate.yaml
  #========================================
  deploy-prod:
    name: Deploy - Production
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    needs: build
    if: github.event.repository.fork == false
    steps:
      #========================================
      # Download website artifact for production deployment
      #========================================
      - name: Download Artifact - Website
        uses: actions/download-artifact@v7
        with:
          name: forrt-website-${{ github.run_number }}
          path: ${{ github.repository }}/forrt-website

      #========================================
      # Deploy website to production GitHub Pages
      #========================================
      - name: Deploy - GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ github.repository }}/forrt-website
          publish_branch: gh-pages
          cname: forrt.org
